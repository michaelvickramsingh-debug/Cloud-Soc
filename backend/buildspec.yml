version: 0.2

phases:
  pre_build:
    commands:
      - AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
      - REPOSITORY_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/cloudguard-backend"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$REPOSITORY_URI"
  build:
    commands:
      - docker build --tag cloudguard-backend:latest .
      - docker tag cloudguard-backend:latest "$REPOSITORY_URI:latest"
  post_build:
    commands:
      - docker push "$REPOSITORY_URI:latest"
